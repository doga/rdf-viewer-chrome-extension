<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Options — RDF Viewer</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1a2333;
    --muted: #64708a;
    --accent: #3565e0;
    --accent-ink: #ffffff;
    --danger: #d24444;
    --ok: #1f9d6b;
    --border: #dfe4f0;
    --chip: #eef2fc;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: start center;
    padding: 40px 16px;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 8px 30px rgba(26, 35, 51, 0.08);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.35rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  .subtitle { margin: 0 0 24px; color: var(--muted); font-size: 0.92rem; }

  label {
    display: block;
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1;
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-row input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(53, 101, 224, 0.15);
  }
  .input-row input.invalid {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px rgba(210, 68, 68, 0.12);
  }
  button {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: filter 0.15s, transform 0.05s;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: default; }
  .btn-add { background: var(--accent); color: var(--accent-ink); padding: 10px 18px; }
  .btn-add:hover:not(:disabled) { filter: brightness(1.1); }

  ul#list { list-style: none; margin: 14px 0 22px; padding: 0; display: grid; gap: 8px; }
  li.chip {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--chip);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px 9px 14px;
    font-size: 0.9rem;
  }
  li.chip .favicon {
    width: 16px; height: 16px;
    border-radius: 4px;
    background: var(--accent);
    flex: none;
    opacity: 0.85;
  }
  li.chip code {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.84rem;
  }
  li.chip .remove {
    background: none;
    color: var(--danger);
    font-size: 1rem;
    padding: 2px 8px;
    line-height: 1;
  }
  li.chip .remove:hover { background: rgba(210, 68, 68, 0.1); border-radius: 6px; }
  .empty {
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 22px;
    text-align: center;
    font-size: 0.9rem;
  }

  .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
  .hint.invalid-hint { color: var(--danger); display: none; }
  .hint.invalid-hint.show { display: block; }

  #status {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translate(-50%, 80px);
    background: var(--ink);
    color: #fff;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.25s ease, opacity 0.25s ease;
    max-width: 90vw;
  }
  #status.show { transform: translate(-50%, 0); opacity: 1; }
  #status.ok::before { content: "✓ "; color: #6fe3a9; }
  #status.err::before { content: "✕ "; color: #ff9b9b; }
  #status.warn::before { content: "! "; color: #ffd479; }
</style>
</head>
<body>
<main>
  <h1><span class="logo">⚡</span> Startup Fetcher</h1>
  <p class="subtitle">URLs added here are fetched when the browser starts. You'll be asked to grant access to each site once.</p>

  <label for="url-input">Add a URL</label>
  <div class="input-row">
    <input id="url-input" type="text" placeholder="https://api.example.com/data.json"
           autocomplete="off" spellcheck="false" />
    <button id="add-btn" class="btn-add">Add</button>
  </div>
  <p class="hint" id="input-hint">Press Enter to add. Only http(s) URLs are accepted.</p>
  <p class="hint invalid-hint" id="invalid-hint"></p>

  <ul id="list"></ul>

  <footer>
    <button id="save-btn" class="btn-add" style="width:100%; padding:12px;">Save</button>
    <p class="hint" id="save-hint">Saving asks the browser for permission to access the sites above (Chrome shows a confirmation prompt).</p>
  </footer>
</main>
<div id="status" role="status" aria-live="polite"></div>
